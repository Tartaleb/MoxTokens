<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a1a2e" />
<title>MoxTokens — Tokens de tes decks Moxfield</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>">
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="app">
  <header class="hero">
    <h1>MoxTokens</h1>
  </header>

  <section class="card">
    <div class="field">
      <label for="username">Username Moxfield</label>
      <div class="row">
        <input id="username" type="text" autocomplete="username" placeholder="ton-pseudo-moxfield" />
        <button id="loadDecks" type="button">Charger les decks</button>
      </div>
      <p class="micro">Seuls les decks <strong>publics</strong> sont visibles (limitation API Moxfield).</p>
    </div>

    <div id="status" class="status" hidden></div>
  </section>

  <section id="decksSection" class="card" hidden>
    <div class="section-head">
      <h2>Decks <span id="decksVisibleCount" class="badge"></span></h2>
      <div class="actions">
        <button id="selectAll" type="button" class="ghost">Tout cocher</button>
        <button id="selectNone" type="button" class="ghost">Tout décocher</button>
      </div>
    </div>
    <div class="field" style="margin-bottom:12px">
      <span class="label">Filtrer par format</span>
      <div class="checks" id="formatFilter"></div>
    </div>
    <div class="field" style="margin-bottom:12px">
      <label for="dateFilter">Modifiés après le</label>
      <div class="row">
        <input id="dateFilter" type="date" style="flex:0 0 auto;width:auto" />
        <button id="dateFilterClear" type="button" class="ghost">Effacer</button>
      </div>
    </div>
    <div id="decksList" class="decks"></div>

    <div class="field" style="margin-top:14px">
      <span class="label">Inclure</span>
      <div class="checks" id="boardsChoice">
        <label class="check"><input type="checkbox" value="commanders" checked /><span>Commanders</span></label>
        <label class="check"><input type="checkbox" value="mainboard" checked /><span>Mainboard</span></label>
        <label class="check"><input type="checkbox" value="sideboard" /><span>Sideboard</span></label>
        <label class="check"><input type="checkbox" value="maybeboard" /><span>Maybeboard</span></label>
        <label class="check"><input type="checkbox" value="tokens" checked /><span>Tokens</span></label>
      </div>
    </div>

    <div class="footer-actions">
      <button id="extractList" type="button">Liste de noms</button>
      <button id="extractImages" type="button" class="primary">Illustrations</button>
    </div>
  </section>

  <section id="resultSection" class="card" hidden>
    <div class="section-head">
      <h2 id="resultTitle">Résultat <span id="resultCount" class="badge"></span></h2>
      <div class="actions">
        <button id="copyNames" type="button" class="ghost">Copier les noms</button>
      </div>
    </div>
    <div id="resultBody"></div>
  </section>

  <footer class="legal">
    <p>App non-officielle. Données depuis <a href="https://www.moxfield.com" target="_blank" rel="noopener">moxfield.com</a> &amp; <a href="https://scryfall.com" target="_blank" rel="noopener">scryfall.com</a>. Magic: The Gathering © Wizards of the Coast.</p>
  </footer>
</main>

<script src="app.js"></script>
</body>
</html>
